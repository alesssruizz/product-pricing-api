//file:noinspection GroovyAssignabilityCheck
plugins {
    id 'java'
    id 'idea'
    id 'checkstyle'
    id 'jacoco'
    id 'org.springframework.boot' version '4.1.1'
    id 'io.spring.dependency-management' version '1.1.7'
    id 'com.diffplug.spotless' version '8.10.2'
    id 'com.github.spotbugs' version '6.5.12'
}

group = 'com.inditex'
version = '0.0.1-SNAPSHOT'
description = 'product-pricing-api'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

repositories {
    mavenCentral()
}

dependencies {
    implementation 'org.springframework.boot:spring-boot-starter-webmvc'
    implementation 'org.springframework.boot:spring-boot-h2console'
    implementation 'org.springdoc:springdoc-openapi-starter-webmvc-ui:3.1.1'
    implementation 'org.springframework:spring-core:7.0.9'
    implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
    implementation 'com.google.guava:guava:33.7.1-jre'
    compileOnly 'org.projectlombok:lombok:1.18.48'
    annotationProcessor 'org.projectlombok:lombok:1.18.48'
    testCompileOnly 'org.projectlombok:lombok:1.18.48'
    testAnnotationProcessor 'org.projectlombok:lombok:1.18.48'

    developmentOnly 'org.springframework.boot:spring-boot-devtools'

    runtimeOnly 'com.h2database:h2'

    testImplementation 'org.springframework.boot:spring-boot-starter-webmvc-test'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'

    spotbugsPlugins 'com.h3xstream.findsecbugs:findsecbugs-plugin:1.14.0'
}

spotless {
    java {
        googleJavaFormat().reorderImports(false)

        importOrder('\\#java', '\\#com.inditex', '\\#', 'java', 'com.inditex', '')
        removeUnusedImports()
        endWithNewline()
        formatAnnotations()
        shortenFullyQualifiedTypes()

    }
}

checkstyle {
    toolVersion = '14.3.0'
}

spotbugs {
    toolVersion = '4.10.4'
    excludeFilter = file('config/spotbugs/exclude-filter.xml')
    onlyAnalyze = ['com.inditex.-']

}

spotbugsMain {
    reports {
        register('html') {
            required = true
        }
    }
}

spotbugsTest {
    reports {
        register('html') {
            required = true
        }
    }
}

sourceSets {
    main {
        java { srcDirs = ['apps/main', 'pricing/main'] }
        resources { srcDirs = ['apps/main/resources', 'pricing/main/resources'] }
    }
    test {
        java { srcDirs = ['apps/test', 'pricing/test'] }
        resources { srcDirs = ['apps/test/resources', 'pricing/test/resources'] }
    }
}

test {
    useJUnitPlatform()

    testLogging {
        events "passed", "skipped", "failed"
    }

    finalizedBy jacocoTestReport
}

jacocoTestReport{
    dependsOn test
}

jacoco {
    toolVersion = "0.8.15"
}
