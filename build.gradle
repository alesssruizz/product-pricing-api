plugins {
    id 'java'
    id 'idea'
    id 'org.springframework.boot' version '4.1.1'
    id 'io.spring.dependency-management' version '1.1.7'
    id 'com.diffplug.spotless' version '8.10.2'
}

group = 'com.inditex'
version = '0.0.1-SNAPSHOT'
description = 'product-pricing-api'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

repositories {
    mavenCentral()
}

dependencies {
    implementation 'org.springframework.boot:spring-boot-starter-webmvc'
    implementation 'org.springframework.boot:spring-boot-h2console'
    implementation 'org.springdoc:springdoc-openapi-starter-webmvc-ui:3.1.0'
    implementation 'org.springframework:spring-core:7.0.9'
    implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
    implementation 'org.reflections:reflections:0.10.2'
    implementation 'com.google.guava:guava:33.7.1-jre'

    developmentOnly 'org.springframework.boot:spring-boot-devtools'

    runtimeOnly 'com.h2database:h2'

    testImplementation 'org.springframework.boot:spring-boot-starter-webmvc-test'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

spotless {
    java {
        prettier(['prettier': '3.0.3', 'prettier-plugin-java': '2.3.0'])
                .config(['parser': 'java', 'tabWidth': 4, 'printWidth': 100, 'plugins': ['prettier-plugin-java']])

        importOrder('\\#', 'java', '', 'com.inditex')
        removeUnusedImports()
        endWithNewline()
        formatAnnotations()
    }
}

sourceSets {
    main {
        java { srcDirs = ['apps/main', 'pricing/main'] }
        resources { srcDirs = ['apps/main/resources', 'pricing/main/resources'] }
    }
    test {
        java { srcDirs = ['apps/test', 'pricing/test'] }
        resources { srcDirs = ['apps/test/resources', 'pricing/test/resources'] }
    }
}

test {
    useJUnitPlatform()

    testLogging {
        events "passed", "skipped", "failed"
    }
}
